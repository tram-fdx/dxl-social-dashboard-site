<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Social Dashboard</title>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1f2740;--muted:#7b8496;--line:#e9ecf2;
--fb:#1877f2;--ig:#e1306c;--yt:#ff0000;--li:#0a66c2;--pos:#12b76a;--neg:#f04438;--rail:#0b1533;--accent:#5b6bf5;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.app{display:flex;min-height:100vh}
.rail{width:74px;background:var(--rail);flex:none;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;position:sticky;top:0;height:100vh}
.rail .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5b6bf5,#22d3ee);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:10px}
.rbtn{width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:.15s;background:#26304f}
.rbtn:hover{opacity:.85}
.rbtn.active{opacity:1;box-shadow:0 0 0 2px #fff inset}
.rlabel{color:#9aa6c6;font-size:9px;margin-top:-2px;margin-bottom:4px}
.main{flex:1;padding:20px 24px;min-width:0;max-width:1400px}
.hd{background:var(--card);border-radius:var(--radius);padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 3px rgba(20,30,60,.06);margin-bottom:16px}
.hd .ttl{display:flex;align-items:center;gap:12px}
.hd .badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.hd h1{font-size:18px;font-weight:800}
.hd .per{font-size:12px;color:var(--muted)}
.hd .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.pdfpop{position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:290px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,30,60,.16);padding:14px;display:none}
.pdfpop.open{display:block}
.pdfpop h4{font-size:12px;font-weight:800;margin-bottom:10px;letter-spacing:.02em}
.pdfpop label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 4px}
.pdfpop select{width:100%;font-size:12px;font-weight:600;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);margin-bottom:9px;cursor:pointer}
.pdfpop .pdfquick{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pdfpop .pdfquick button{flex:1 1 auto;font-size:11px;font-weight:700;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:#f6f8fc;color:var(--ink);cursor:pointer}
.pdfpop .pdfquick button:hover{background:#eef1f6}
.pdfpop .pdfmeta{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.pdfpop .pdfact{display:flex;gap:8px}
.pdfpop .pdfact button{flex:1;font-size:12px;font-weight:700;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.pdfpop .pdfact button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.pdfpop .pdfact button:disabled{opacity:.55;cursor:not-allowed}
.chip{font-size:11px;background:#eef2ff;color:#3949ab;padding:5px 10px;border-radius:999px;font-weight:700}
.tbtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.langfloat{position:fixed;right:22px;top:14px;z-index:60;display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 24px rgba(20,30,60,.20);overflow:hidden}
.langfloat button{font-size:12px;font-weight:800;letter-spacing:.4px;padding:10px 16px;border:none;background:#fff;color:var(--ink);cursor:pointer;line-height:1}
.langfloat button:hover{background:#eef1f6}
.langfloat button.on{background:var(--accent);color:#fff}
.langfloat button.on:hover{background:var(--accent)}
@media print{.langfloat{display:none}}
@media (max-width:640px){.langfloat{right:12px;top:10px}.langfloat button{padding:9px 13px}}
#langBtn{display:none}
.tbtn:hover{background:#eef1f6}
.tbtn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);padding:15px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06);border-top:3px solid var(--accent)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .v{font-size:26px;font-weight:800;margin-top:6px}
.kpi .c{font-size:12px;font-weight:700;margin-top:3px}
.c.up{color:var(--pos)}.c.down{color:var(--neg)}.c.flat{color:var(--muted)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g2,.g3,.g2e{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.panel h3{font-size:13px;font-weight:800;margin-bottom:12px}
.chart{position:relative;height:250px}.chart.sm{height:210px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.post{max-width:360px;color:#3b4560}
a{color:var(--fb);text-decoration:none}a:hover{text-decoration:underline}
ul.clean{list-style:none}ul.clean li{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
ul.clean li:last-child{border:none}ul.clean li::before{content:"▹";color:var(--accent);font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fef3c7;color:#92400e}.pill.none{background:#eef2ff;color:#3730a3}
.snap{display:flex;align-items:center;gap:14px}.snap .big{font-size:40px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.foot{font-size:12px;color:#9aa6c6;margin:18px 0 6px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:17px;margin-bottom:12px}
.modal ol{margin:0 0 8px 18px}.modal li{font-size:13px;margin:7px 0}
.modal .x{float:right;cursor:pointer;color:var(--muted);font-weight:800;border:none;background:none;font-size:18px}

/* ---- date picker / metastrip ---- */
.metastrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.mtag{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#5b6472}
.mtag.on{background:#e8f7ef;border-color:#bfe8d2;color:#166534}
.mtag.hist{background:#fdeee9;border-color:#f7c9ba;color:#b4451f;text-decoration:none}
.mtag.hist:hover{background:#fbe0d7;text-decoration:none}
#sec-filter{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06);margin-bottom:16px}
.dp-lab{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
.acc-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.acc-head .acc-sub{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.acc-chev{flex:none;width:15px;height:15px;color:var(--muted);transition:transform .2s}
.acc-head[aria-expanded="true"] .acc-chev{transform:rotate(180deg)}
.acc-body{display:none}
.acc-body.open{display:block}
#sec-trend{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06);margin-bottom:16px}
.tr-sec{margin-top:14px}
.tr-sec .th{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.tr-sec .th b{font-size:13px;font-weight:800}
.tr-sec .th span{font-size:11.5px;color:var(--muted)}
.tr-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px}
.tr-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px 8px}
.tr-card .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;line-height:1.3;min-height:27px}
.tr-card .v{font-size:20px;font-weight:800;letter-spacing:-.3px}
.tr-card .d{font-size:11.5px;font-weight:700;margin-top:1px}
.tr-card .d.up{color:var(--pos)}.tr-card .d.down{color:var(--neg)}.tr-card .d.flat{color:var(--muted)}
.tr-spark{height:44px;margin-top:6px}
@media(max-width:640px){.tr-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.dp-lab .bar{width:22px;height:3px;border-radius:2px;background:#e8543a;display:inline-block}
.dp-help{font-size:12.5px;color:var(--muted);margin:8px 0 14px;max-width:900px;line-height:1.5}
.dp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.dp-btn{font-size:13px;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.dp-btn:hover{background:#f5f7fb}
.dp-state{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:#fdeee9;color:#b4451f}
.dp-quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.dp-quick .qh{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-right:2px}
.dp-chip{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left}
.dp-chip:hover{background:#f5f7fb}
.dp-chip .cl{font-weight:500;color:var(--muted);margin-left:7px;font-size:11px}
.dp-chip.cur{background:#e8543a;border-color:#e8543a;color:#fff}
.dp-chip.cur .cl{color:#ffd9cf}
.dp-pop{position:absolute;top:46px;left:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 44px rgba(20,30,60,.18);padding:16px 18px;display:none}
.dp-pop.open{display:block}
.dp-cal{display:flex;gap:26px}
.dp-m{min-width:212px}
.dp-mh{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:8px}
.dp-nav{border:none;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.dp-nav:disabled{opacity:.25;cursor:default}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{font-size:10.5px;color:var(--muted);text-align:center;padding:3px 0;font-weight:700}
.dp-day{position:relative;height:28px;border:none;background:none;border-radius:7px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.dp-day.dim{color:#c3c9d4;cursor:default}
.dp-day.pad{visibility:hidden}
.dp-day:not(.dim):hover{background:#f0f2f7}
.dp-day.sel{background:#e8543a;color:#fff;font-weight:800}
.dp-day .dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#e8543a}
.dp-day.sel .dot{background:#fff}
.dp-foot{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.dp-sum{font-size:13px;font-weight:800;margin-bottom:2px}
.dp-sub{font-size:11.5px;color:var(--muted);line-height:1.5}
.dp-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.dp-ok{background:#e8543a;color:#fff;border:1px solid #e8543a;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px;cursor:pointer}
.dp-ok:disabled{background:#f0d4cd;border-color:#f0d4cd;cursor:not-allowed}
.dp-cancel{background:#fff;border:1px solid var(--line);font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--ink)}
.dp-legend{font-size:11px;color:var(--muted);margin-top:10px}
.dp-legend .d{color:#e8543a;font-weight:800}
</style>
</head>

<script>
(function(){var h=document.getElementById("dxr-title"),b=document.getElementById("dxr-badge");
var L=function(){try{return (typeof lang!=="undefined"&&lang)?lang:"vi";}catch(e){return "vi";}};
function up(){if(h)h.textContent=(L()==="en")?"Range explorer":"Xem theo kho\u1ea3ng th\u1eddi gian";
if(b)b.textContent=(L()==="en")?"DERIVED FROM STORED DAYS":"D\u1eaaN XU\u1ea4T T\u1eea C\u00c1C NG\u00c0Y \u0110\u00c3 L\u01afU";}
up();setInterval(up,400);})();
window.__DXR_CFG={rollup:"data/rollup.json",lang:function(){try{return (typeof lang!=="undefined"&&lang)?lang:"vi";}catch(e){return "vi";}}};
/* ==== DX RANGE EXPLORER v2 =====================================
   Đọc data/rollup.json (FILE DẪN XUẤT, dựng lại mỗi sáng từ các
   file ngày bất biến). Mỗi chuỗi có nhãn grain và chỉ được phép
   làm đúng phép tính hợp lệ với nhãn đó:
     day       -> cộng dồn được trong khoảng
     window28  -> KHÔNG cộng (các ngày chồng nhau), chỉ đầu->cuối
     state     -> trung bình / giá trị cuối kỳ
   Tự ẩn nếu không đọc được rollup (bản archive).
   ================================================================ */
(function(){
  var CFG=window.__DXR_CFG; if(!CFG) return;
  var S={ser:null,dates:[],mode:'trend',from:null,to:null,a:null,b:null,lang:null,ready:false};
  function L(){ try{return CFG.lang();}catch(e){return 'vi';} }
  function t(vi,en){ return L()==='en'?en:vi; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function nf(v,dp){ if(v===null||v===undefined||!isFinite(v)) return '—';
    return v.toLocaleString(L()==='en'?'en-US':'vi-VN',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0}); }
  function fd(d){ if(L()==='en') return d; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function dp(k){ return /pct|ctr|position/.test(k)?(/position/.test(k)?1:2):0; }
  function lower(k){ return /position|ttfb/.test(k); }

  function spark(vals){
    var nums=vals.filter(function(v){return v!==null;});
    if(nums.length<2) return '<span class="dxr-nospark">'+t('chưa đủ điểm','too few points')+'</span>';
    var mn=Math.min.apply(null,nums),mx=Math.max.apply(null,nums),rg=(mx-mn)||1,W=120,H=28,n=vals.length;
    var seg=[],cur=[],i;
    for(i=0;i<n;i++){ if(vals[i]===null){ if(cur.length){seg.push(cur);cur=[];} continue; }
      cur.push(((n===1?0:i/(n-1)*W)).toFixed(1)+','+(H-2-((vals[i]-mn)/rg)*(H-6)).toFixed(1)); }
    if(cur.length) seg.push(cur);
    var g=seg.map(function(s){ return s.length===1
      ?'<circle cx="'+s[0].split(',')[0]+'" cy="'+s[0].split(',')[1]+'" r="1.7" fill="currentColor"/>'
      :'<polyline points="'+s.join(' ')+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';}).join('');
    var last=null; for(i=n-1;i>=0;i--){ if(vals[i]!==null){last=i;break;} }
    if(last!==null) g+='<circle cx="'+((n===1?0:last/(n-1)*W)).toFixed(1)+'" cy="'+(H-2-((vals[last]-mn)/rg)*(H-6)).toFixed(1)+'" r="2.4" fill="currentColor"/>';
    return '<svg class="dxr-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+g+'</svg>';
  }
  function deltaCell(key,a,b){
    if(a===null||b===null) return {txt:'—',cls:'dxr-flat'};
    var diff=b-a,better=lower(key)?diff<0:diff>0,d=dp(key);
    var cls=diff===0?'dxr-flat':(better?'dxr-up':'dxr-down');
    var txt=(diff===0?'▬':(diff>0?'▲':'▼'))+' '+(diff>0?'+':'')+nf(diff,d);
    if(a!==0) txt+=' ('+(diff/Math.abs(a)*100>0?'+':'')+(diff/Math.abs(a)*100).toFixed(1)+'%)';
    return {txt:txt,cls:cls};
  }
  function inR(d){ return d>=S.from && d<=S.to; }
  function opts(sel,list){ return list.map(function(d){
    return '<option value="'+d+'"'+(d===sel?' selected':'')+'>'+fd(d)+'</option>';}).join(''); }

  var GRAINS=[
    {g:'day',  vi:'Số theo ngày thật — cộng dồn được',      en:'True daily figures — summable'},
    {g:'window28',vi:'Ảnh chụp cửa sổ 28 ngày — KHÔNG cộng được', en:'28-day rolling snapshots — NOT summable'},
    {g:'state',vi:'Chỉ số trạng thái — lấy đầu kỳ / cuối kỳ',en:'State metrics — first / last of range'}
  ];
  function grainNote(g){
    if(g==='day') return t('Mỗi điểm là số đo của đúng ngày đó, nên tổng trong khoảng là con số thật.',
                           'Each point is that day’s own measurement, so the range total is a real number.');
    if(g==='window28') return t('Mỗi điểm đã là tổng của 28 ngày trước đó; hai ngày liền nhau chồng nhau 27 ngày. Cộng lại sẽ đếm trùng, nên chỉ so đầu kỳ với cuối kỳ.',
                           'Each point is already a 28-day total; consecutive days overlap by 27. Summing would double-count, so only the first and last are compared.');
    return t('Giá trị tại thời điểm quét (không phải luỹ kế), nên chỉ so đầu kỳ với cuối kỳ.',
             'A value at the moment of the scan, not a cumulative figure, so only first and last are compared.');
  }

  function render(){
    var el=document.getElementById('dxr-body'); if(!el) return; S.lang=L();
    var head='<div class="dxr-tabs">'+
      '<button class="dxr-tab'+(S.mode==='trend'?' on':'')+'" data-m="trend">'+t('Xu hướng theo khoảng','Trend over a range')+'</button>'+
      '<button class="dxr-tab'+(S.mode==='cmp'?' on':'')+'" data-m="cmp">'+t('So sánh hai ngày','Compare two days')+'</button></div>';
    var ctrl = S.mode==='trend'
      ? '<div class="dxr-ctrl"><label>'+t('Từ','From')+' <select id="dxr-from">'+opts(S.from,S.dates)+'</select></label>'+
        '<label>'+t('Đến','To')+' <select id="dxr-to">'+opts(S.to,S.dates)+'</select></label>'+
        '<span class="dxr-hint" id="dxr-count"></span></div>'
      : '<div class="dxr-ctrl"><label>'+t('Ngày A','Day A')+' <select id="dxr-a">'+opts(S.a,S.dates)+'</select></label>'+
        '<label>'+t('Ngày B','Day B')+' <select id="dxr-b">'+opts(S.b,S.dates)+'</select></label></div>';
    var note='<p class="dxr-note">'+t(
      '<b>Đọc từ <code>data/rollup.json</code></b> — file dẫn xuất dựng lại mỗi sáng từ các file ngày bất biến, không sửa tay. Mỗi chỉ số mang một <b>nhãn grain</b> và bảng dưới chỉ làm đúng phép tính hợp lệ với nhãn đó. Ngày không quét <b>không bao giờ được nội suy</b>; ô “—” nghĩa là ngày đó không đo chỉ số này.',
      '<b>Read from <code>data/rollup.json</code></b> — a derived file rebuilt each morning from the immutable day files, never hand-edited. Every metric carries a <b>grain label</b>, and the table below only performs the arithmetic that label allows. Unscanned days are <b>never interpolated</b>; a “—” means that metric was not measured that day.')+'</p>';
    el.innerHTML=head+ctrl+note+'<div id="dxr-out"></div>';
    el.querySelectorAll('.dxr-tab').forEach(function(b){ b.onclick=function(){S.mode=b.dataset.m;render();};});
    var f=document.getElementById('dxr-from'),to=document.getElementById('dxr-to'),
        a=document.getElementById('dxr-a'),b2=document.getElementById('dxr-b');
    if(f) f.onchange=function(){S.from=f.value; if(S.from>S.to)S.to=S.from; render();};
    if(to) to.onchange=function(){S.to=to.value; if(S.to<S.from)S.from=S.to; render();};
    if(a) a.onchange=function(){S.a=a.value;draw();};
    if(b2) b2.onchange=function(){S.b=b2.value;draw();};
    draw();
  }

  function draw(){
    var out=document.getElementById('dxr-out'); if(!out) return;
    var keys=Object.keys(S.ser), html='';
    if(S.mode==='trend'){
      var span=S.dates.filter(inR).length;
      var c=document.getElementById('dxr-count');
      if(c) c.innerHTML=span+' '+t('ngày có dữ liệu trong khoảng','days with data in range');
      html='<div class="dxr-rangelbl">'+fd(S.from)+' → '+fd(S.to)+'</div>';
      GRAINS.forEach(function(G){
        var ks=keys.filter(function(k){return S.ser[k].grain===G.g;});
        if(!ks.length) return;
        var any=false, rows='';
        ks.forEach(function(k){
          var s=S.ser[k], pts=s.points.filter(function(p){return inR(p.d);});
          if(!pts.length){ rows+='<tr><td>'+esc(s.label)+'</td><td class="dxr-n" colspan="4">—</td></tr>'; return; }
          any=true; var vals=pts.map(function(p){return p.v;}), d=dp(k);
          if(G.g==='day'){
            var sum=vals.reduce(function(x,y){return x+y;},0);
            var avg=sum/vals.length, mx=Math.max.apply(null,vals);
            var mxd=pts[vals.indexOf(mx)].d;
            rows+='<tr><td>'+esc(s.label)+'</td><td class="dxr-n dxr-strong">'+nf(sum,d)+'</td><td class="dxr-n">'+nf(avg,1)+
              '</td><td class="dxr-n">'+nf(mx,d)+' <span class="dxr-hint">'+fd(mxd)+'</span></td>'+
              '<td class="dxr-sparkcell">'+spark(vals)+'</td></tr>';
          } else {
            var va=vals[0],vb=vals[vals.length-1],dd=deltaCell(k,va,vb);
            rows+='<tr><td>'+esc(s.label)+'</td><td class="dxr-n">'+nf(va,d)+'</td><td class="dxr-n">'+nf(vb,d)+
              '</td><td class="dxr-n '+dd.cls+'">'+dd.txt+'</td><td class="dxr-sparkcell '+dd.cls+'">'+spark(vals)+'</td></tr>';
          }
        });
        var hdr = G.g==='day'
          ? '<th>'+t('Chỉ số','Metric')+'</th><th class="dxr-n">'+t('Tổng trong khoảng','Range total')+'</th><th class="dxr-n">'+t('TB/ngày','Per day')+'</th><th class="dxr-n">'+t('Ngày cao nhất','Peak day')+'</th><th>'+t('Đường đi','Path')+'</th>'
          : '<th>'+t('Chỉ số','Metric')+'</th><th class="dxr-n">'+t('Đầu kỳ','First')+'</th><th class="dxr-n">'+t('Cuối kỳ','Last')+'</th><th class="dxr-n">'+t('Chênh lệch','Change')+'</th><th>'+t('Đường đi','Path')+'</th>';
        html+='<div class="dxr-grp"><div class="dxr-grpt dxr-g-'+G.g+'">'+t(G.vi,G.en)+'</div>'+
              '<p class="dxr-grpn">'+grainNote(G.g)+'</p>'+
              '<table class="dxr-tbl"><thead><tr>'+hdr+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
      });
      if(!html) html='<p class="dxr-warn">'+t('Không có chỉ số nào trong khoảng này.','No metrics in this range.')+'</p>';
    } else {
      html='<div class="dxr-rangelbl">'+fd(S.a)+' → '+fd(S.b)+(S.a===S.b?' <span class="dxr-hint">('+t('cùng một ngày','same day')+')</span>':'')+'</div>';
      GRAINS.forEach(function(G){
        var ks=keys.filter(function(k){return S.ser[k].grain===G.g;});
        if(!ks.length) return; var rows='';
        ks.forEach(function(k){
          var s=S.ser[k],d=dp(k);
          function at(dt){ var p=s.points.filter(function(x){return x.d===dt;})[0]; return p?p.v:null; }
          var va=at(S.a),vb=at(S.b),dd=deltaCell(k,va,vb);
          rows+='<tr><td>'+esc(s.label)+'</td><td class="dxr-n">'+nf(va,d)+'</td><td class="dxr-n">'+nf(vb,d)+
                '</td><td class="dxr-n '+dd.cls+'">'+dd.txt+'</td></tr>';
        });
        html+='<div class="dxr-grp"><div class="dxr-grpt dxr-g-'+G.g+'">'+t(G.vi,G.en)+'</div>'+
              '<table class="dxr-tbl"><thead><tr><th>'+t('Chỉ số','Metric')+'</th><th class="dxr-n">'+fd(S.a)+
              '</th><th class="dxr-n">'+fd(S.b)+'</th><th class="dxr-n">'+t('Chênh lệch','Change')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
      });
    }
    out.innerHTML=html;
  }

  function hide(){ var s=document.getElementById('dxr'); if(s) s.style.display='none'; }
  function start(){
    fetch(CFG.rollup,{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || !j.series) throw 0;
      S.ser=j.series;
      var set={};
      Object.keys(S.ser).forEach(function(k){ S.ser[k].points.forEach(function(p){ set[p.d]=1; }); });
      S.dates=Object.keys(set).sort();
      if(S.dates.length<2){ hide(); return; }
      var n=S.dates.length;
      S.to=S.dates[n-1]; S.from=S.dates[Math.max(0,n-15)];
      S.b=S.dates[n-1]; S.a=S.dates[n-2];
      S.ready=true;
      var sec=document.getElementById('dxr'); if(sec) sec.style.display='';
      render();
      setInterval(function(){ if(S.ready&&L()!==S.lang) render(); },400);
    }).catch(hide);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();

</script>

let lang="en", current="all", charts=[];  // English is the pinned default on load
const $=id=>document.getElementById(id);
const tt=(o)=>o[lang];
const num=v=>typeof v==="string"?v:v.toLocaleString();
const COLORS=["#1877f2","#5b6bf5","#22c55e","#f59e0b","#e1306c","#06b6d4"];
function clearCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];}
function chg(c){if(c==null)return `<div class="c flat">${tt(T.snapshotTag)}</div>`;const cls=c>0?"up":(c<0?"down":"flat");const a=c>0?"▲":(c<0?"▼":"■");return `<div class="c ${cls}">${a} ${Math.abs(c)}% ${tt(T.vsPrior)}</div>`;}
function kpis(arr){return `<div class="kpirow">`+arr.map(k=>`<div class="kpi"><div class="l">${k[lang]}</div><div class="v">${num(k.v)}</div>${chg(k.c)}</div>`).join("")+`</div>`;}
function line(id,labels,data,color){charts.push(new Chart($(id),{type:"line",data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+"22",fill:true,tension:.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:7,font:{size:10}}},y:{beginAtZero:true,ticks:{font:{size:10}}}}}}));}
function bar(id,labels,data,colors){charts.push(new Chart($(id),{type:"bar",data:{labels,datasets:[{data,backgroundColor:colors||"#5b6bf5",borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));}
function dough(id,labels,data){charts.push(new Chart($(id),{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:COLORS,borderColor:"#fff",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}}));}
function list(arr){return `<ul class="clean">`+arr.map(t=>`<li>${t}</li>`).join("")+`</ul>`;}

const PDFCH=["all","linkedin","instagram","facebook","youtube"];
let PDFDAYS=[];

function pdfFmt(iso){const[y,m,d]=iso.split("-");return d+"/"+m+"/"+y;}
function pdfSel(id){return $(id).value;}
function pdfRangeDays(){
  const a=PDFDAYS.indexOf(pdfSel("pdfFrom")),b=PDFDAYS.indexOf(pdfSel("pdfTo"));
  if(a<0||b<0||a>b)return null;
  return PDFDAYS.slice(a,b+1);
}
function pdfSyncMeta(){
  const r=pdfRangeDays();

function pdfLabels(){

  pdfSyncMeta();
}
function pdfFill(days){
  PDFDAYS=days;
  const opt=d=>'<option value="'+d+'">'+pdfFmt(d)+'</option>';
  $("pdfFrom").innerHTML=days.map(opt).join("");
  $("pdfTo").innerHTML=days.map(opt).join("");

function pdfQuickSet(n){

}

// capture the five channel views of one document into the pdf
async function pdfCaptureDoc(win,doc,addPage,scale){
  const main=doc.querySelector(".main");
  if(!main)return;
  const hide=[doc.getElementById("sec-filter"),doc.getElementById("metastrip"),doc.getElementById("sec-trend"),doc.getElementById("langFloat"),doc.querySelector(".hd .right")].filter(Boolean);
  const memo=hide.map(e=>e.style.display);
  try{
    for(const k of PDFCH){
      const rb=doc.querySelector('.rbtn[data-k="'+k+'"]');
      if(rb)rb.click();
      hide.forEach(e=>{e.style.display="none";});
      await new Promise(r=>setTimeout(r,900));
      const cv=await win.html2canvas(main,{scale:scale,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:main.scrollWidth});
      addPage(cv);
    }
  }finally{
    hide.forEach((e,i)=>{e.style.display=memo[i];});
  }
}

function pdfInject(win,doc,src){
  return new Promise((ok,bad)=>{
    if(typeof win.html2canvas==="function")return ok();
    const sc=doc.createElement("script");sc.src=src;sc.onload=()=>ok();sc.onerror=()=>bad();doc.head.appendChild(sc);
  });
}
const H2C_SRC="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";

async function downloadPdf(){
  const go=$("pdfGo");
  if(go.dataset.busy)return;
  const days=pdfRangeDays();
  if(!days)return;
  const jsPDF=(window.jspdf||{}).jsPDF;
  if(typeof html2canvas!=="function"||!jsPDF){alert(tt(T.pdfErr));return;}
  go.dataset.busy="1";go.disabled=true;$("pdfCancel").disabled=true;
  const prev=current;
  const scale=days.length>3?1.5:2;
  let doc=null;
  const addPage=cv=>{
    const w=cv.width/scale,h=cv.height/scale;
    if(!doc)doc=new jsPDF({unit:"pt",format:[w,h],orientation:w>h?"landscape":"portrait"});
    else doc.addPage([w,h],w>h?"landscape":"portrait");
    doc.addImage(cv.toDataURL("image/jpeg",days.length>3?0.85:0.92),"JPEG",0,0,w,h);
  };
  let ifr=null;
  try{
    for(let i=0;i<days.length;i++){
      const d=days[i];
      go.textContent=tt(T.pdfStep)(i+1,days.length,pdfFmt(d));
      if(d===SNAPDATE){
        await pdfCaptureDoc(window,document,addPage,scale);
      }else{
        ifr=document.createElement("iframe");
        ifr.setAttribute("aria-hidden","true");
        ifr.style.cssText="position:fixed;left:-20000px;top:0;width:1440px;height:2400px;border:0;visibility:hidden";
        const loaded=new Promise((ok,bad)=>{ifr.onload=()=>ok();ifr.onerror=()=>bad();});
        ifr.src="archive/"+d+".html";
        document.body.appendChild(ifr);
        await loaded;
        await new Promise(r=>setTimeout(r,1400));
        const w2=ifr.contentWindow,d2=ifr.contentDocument;
        await pdfInject(w2,d2,H2C_SRC);
        ifr.style.height=Math.max(2400,d2.body.scrollHeight)+"px";
        await new Promise(r=>setTimeout(r,300));
        await pdfCaptureDoc(w2,d2,addPage,scale);
        ifr.remove();ifr=null;
      }
    }
    const from=days[0],to=days[days.length-1];
    doc.save("DXL-social-dashboard-"+(from===to?from:from+"_to_"+to)+".pdf");
  }catch(e){alert(tt(T.pdfErr));}
  finally{
    if(ifr)try{ifr.remove()}catch(e){}
    current=prev;
    delete go.dataset.busy;go.disabled=false;$("pdfCancel").disabled=false;
    go.textContent=tt(T.pdfGo);
    render();pdfSyncMeta();
  }
}

let TRD=null, trCharts=[], trLoaded=false;
function trClear(){trCharts.forEach(c=>{try{c.destroy()}catch(e){}});trCharts=[];}
const trFmtD=iso=>{const p=iso.split("-");return p[2]+"/"+p[1];};
function trNum(v,d,suf){if(v==null)return "—";const n=(d?Number(v).toFixed(d):Math.round(v).toLocaleString());return n+(suf||"");}
function trDelta(cur,prev,d,suf){
  if(cur==null)return '<div class="d flat">—</div>';
  if(prev==null)return '<div class="d flat">■ '+TRT.first[lang]+'</div>';
  const diff=cur-prev;
  if(Math.abs(diff)<1e-9)return '<div class="d flat">■ '+TRT.nochg[lang]+'</div>';
  const pct=prev?Math.abs(diff/prev*100):null;
  return '<div class="d '+(diff>0?"up":"down")+'">'+(diff>0?"▲":"▼")+" "+trNum(Math.abs(diff),d,suf)+
         (pct!=null?" ("+pct.toFixed(1)+"%)":"")+'</div>';
}
function trSpark(id,labels,data,color){
  const el=$(id); if(!el)return;
  trCharts.push(new Chart(el,{type:"line",
    data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+"1f",fill:true,tension:.35,pointRadius:0,pointHoverRadius:4,borderWidth:2,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:c=>c[0].label}}},
      scales:{x:{display:false},y:{display:false,beginAtZero:false}}}}));
}
function trBlock(key){
  const cfg=TRCH[key], defs=TRKPI[key], labels=TRD.map(r=>trFmtD(r.date));
  let h='<div class="tr-sec"><div class="th"><span class="tr-dot" style="background:'+cfg.color+'"></span><b>'+cfg.name+'</b>'+
        '<span>'+TRT.span[lang](TRD.length,trFmtD(TRD[0].date),trFmtD(TRD[TRD.length-1].date))+'</span></div><div class="tr-grid">';
  const jobs=[];
  defs.forEach((k,i)=>{
    const series=TRD.map(r=>k.g(r.j));
    const cur=series[series.length-1];
    let prev=null;
    for(let n=series.length-2;n>=0;n--){if(series[n]!=null){prev=series[n];break;}}
    const cid="tsp_"+key+"_"+i;
    h+='<div class="tr-card"><div class="l">'+k.l[lang]+'</div><div class="v">'+trNum(cur,k.d,k.suf)+'</div>'+
       trDelta(cur,prev,k.d,k.suf)+'<div class="tr-spark"><canvas id="'+cid+'"></canvas></div></div>';
    jobs.push([cid,series,cfg.color]);
  });
  return {html:h+'</div></div>', jobs, labels};
}
function renderTrend(){

  if(!DPI)return;
  const days=[...DPI.snapshots].sort((a,b)=>b.date.localeCompare(a.date));
  $("dpQuick").innerHTML='<span class="qh">'+DPT.quick[lang]+'</span>'+days.map(s=>{
    const cur=s.date===DPI.latest;
    const lb=(lang==="vi"?s.label_vi:s.label_en)||"";
    return '<button class="dp-chip'+(cur?' cur':'')+'" data-go="'+s.date+'">'+dpFmt(s.date)+
      (lb?'<span class="cl">'+lb+'</span>':'')+'</button>';
  }).join("");
  $("dpQuick").querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    const t=dpTarget(b.dataset.go); if(t) location.href=t;
  }));
}
function dpGrid(el,y,m){
  const first=new Date(y,m,1), lead=first.getDay(), dim=new Date(y,m+1,0).getDate();
  let h=DPT.dow[lang].map(d=>'<div class="dp-dow">'+d+'</div>').join("");
  for(let i=0;i<lead;i++)h+='<button class="dp-day pad"></button>';
  for(let d=1;d<=dim;d++){
    const iso=dpISO(new Date(y,m,d)), has=!!dpSnap(iso), sel=iso===dpSel;
    h+='<button class="dp-day'+(has?"":" dim")+(sel?" sel":"")+'"'+(has?'':' disabled')+
       ' data-d="'+iso+'">'+d+(has?'<span class="dot"></span>':'')+'</button>';
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-d]:not(.dim)").forEach(b=>b.addEventListener("click",()=>{dpSel=b.dataset.d;dpDraw();}));
}
function dpDraw(){
  if(!DPI)return;
  const y=dpMonth.getFullYear(), m=dpMonth.getMonth();
  const nx=new Date(y,m+1,1);
  $("dpM0").textContent=DPT.months[lang][m]+" "+y;
  $("dpM1").textContent=DPT.months[lang][nx.getMonth()]+" "+nx.getFullYear();
  dpGrid($("dpG0"),y,m); dpGrid($("dpG1"),nx.getFullYear(),nx.getMonth());
  const oldest=DPI.snapshots[0].date;
  $("dpPrev").disabled = dpISO(new Date(y,m,1)) <= oldest.slice(0,8)+"01";
  const has=!!dpSnap(dpSel);
  $("dpSum").textContent=dpSel?dpFmt(dpSel):"—";
  $("dpSub").textContent=has?DPT.stored[lang]:DPT.nodata[lang];
  $("dpOk").disabled=!has;
  $("dpBtn").textContent=DPT.btn[lang](dpFmt(dpSel||DPI.latest));
}
function dpRender(){
  if(!DPI)return;
  $("dpTitle").textContent=DPT.title[lang];
  $("dpHelp").innerHTML=DPT.help[lang];
  $("dpOk").textContent=DPT.ok[lang];
  $("dpCancel").textContent=DPT.cancel[lang];
  $("dpLegend").innerHTML=DPT.legend[lang];
  $("dpState").textContent=(lang==="vi"?"Đang xem báo cáo ngày "+dpFmt(DPI.latest)+" (mới nhất)":"Viewing "+dpFmt(DPI.latest)+" (latest)");
  $("dpAccSub").textContent=(lang==="vi"
    ? dpFmt(DPI.latest)+" (mới nhất) · "+DPI.snapshots.length+" ngày đã lưu"
    : dpFmt(DPI.latest)+" (latest) · "+DPI.snapshots.length+" stored days");
  dpRenderMeta(); dpRenderQuick(); dpDraw();
}
if(document.getElementById("sec-filter")){
fetch("data/index.json").then(r=>r.json()).then(j=>{
  j.snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  DPI=j; dpSel=j.latest;
  const d=new Date(j.latest+"T00:00:00"); dpMonth=new Date(d.getFullYear(),d.getMonth()-1,1);
  dpRender();
  const acc=$("dpAcc"), body=$("dpBody");
  acc.addEventListener("click",e=>{
    e.stopPropagation();
    const open=body.classList.toggle("open");
    acc.setAttribute("aria-expanded",open?"true":"false");
    if(!open)$("dpPop").classList.remove("open");
  });
  $("dpBtn").addEventListener("click",e=>{e.stopPropagation();$("dpPop").classList.toggle("open");});
  $("dpCancel").addEventListener("click",()=>{dpSel=DPI.latest;$("dpPop").classList.remove("open");dpDraw();});
  $("dpOk").addEventListener("click",()=>{const t=dpTarget(dpSel);if(t)location.href=t;});
  $("dpPrev").addEventListener("click",()=>{dpMonth=new Date(dpMonth.getFullYear(),dpMonth.getMonth()-1,1);dpDraw();});
  $("dpNext").addEventListener("click",()=>{dpMonth=new Date(dpMonth.getFullYear(),dpMonth.getMonth()+1,1);dpDraw();});
  $("dpPop").addEventListener("click",e=>e.stopPropagation());
  document.addEventListener("click",()=>$("dpPop").classList.remove("open"));
  $("langBtn").addEventListener("click",()=>dpRender());
}).catch(()=>{
  const sec=$("sec-filter"); if(sec)sec.style.display="none";
  const ms=$("metastrip"); if(ms)ms.style.display="none";
});
}

</script>
</body>
</html>
