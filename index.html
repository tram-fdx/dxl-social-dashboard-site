<head>

<title>DX Living — Social Dashboard</title>

<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1f2740;--muted:#7b8496;--line:#e9ecf2;
--fb:#1877f2;--ig:#e1306c;--yt:#ff0000;--li:#0a66c2;--pos:#12b76a;--neg:#f04438;--rail:#0b1533;--accent:#5b6bf5;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.app{display:flex;min-height:100vh}
.rail{width:74px;background:var(--rail);flex:none;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;position:sticky;top:0;height:100vh}
.rail .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5b6bf5,#22d3ee);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:10px}
.rbtn{width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.5;transition:.15s;background:#26304f}
.rbtn:hover{opacity:.85}
.rbtn.active{opacity:1;box-shadow:0 0 0 2px #fff inset}
.rlabel{color:#9aa6c6;font-size:9px;margin-top:-2px;margin-bottom:4px}
.main{flex:1;padding:20px 24px;min-width:0;max-width:1400px}
.hd{background:var(--card);border-radius:var(--radius);padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 3px rgba(20,30,60,.06);margin-bottom:16px}
.hd .ttl{display:flex;align-items:center;gap:12px}
.hd .badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.hd h1{font-size:18px;font-weight:800}
.hd .per{font-size:12px;color:var(--muted)}
.hd .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;background:#eef2ff;color:#3949ab;padding:5px 10px;border-radius:999px;font-weight:700}
.tbtn{font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tbtn:hover{background:#eef1f6}
.tbtn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--radius);padding:15px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06);border-top:3px solid var(--accent)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .v{font-size:26px;font-weight:800;margin-top:6px}
.kpi .c{font-size:12px;font-weight:700;margin-top:3px}
.c.up{color:var(--pos)}.c.down{color:var(--neg)}.c.flat{color:var(--muted)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g2e{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g2,.g3,.g2e{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.panel h3{font-size:13px;font-weight:800;margin-bottom:12px}
.chart{position:relative;height:250px}.chart.sm{height:210px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.post{max-width:360px;color:#3b4560}
a{color:var(--fb);text-decoration:none}a:hover{text-decoration:underline}
ul.clean{list-style:none}ul.clean li{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
ul.clean li:last-child{border:none}ul.clean li::before{content:"▹";color:var(--accent);font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fef3c7;color:#92400e}.pill.none{background:#eef2ff;color:#3730a3}
.snap{display:flex;align-items:center;gap:14px}.snap .big{font-size:40px;font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.foot{font-size:12px;color:#9aa6c6;margin:18px 0 6px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:17px;margin-bottom:12px}
.modal ol{margin:0 0 8px 18px}.modal li{font-size:13px;margin:7px 0}
.modal .x{float:right;cursor:pointer;color:var(--muted);font-weight:800;border:none;background:none;font-size:18px}
</style>
</head>
