<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DX Living — Social Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --line:#262b33;
    --ink:#eef1f5; --muted:#9aa3af; --gold:#c9a24b; --gold2:#e5c877;
    --fb:#1877f2; --ig:#e1306c; --yt:#ff0033; --li:#0a66c2;
    --up:#4ade80; --down:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:28px 22px 60px}
  .wrap{max-width:1220px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
  .brand{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;font-weight:600}
  h1{font-size:26px;font-weight:600;margin-top:4px}
  .hright{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .period{color:var(--muted);font-size:14px}
  .period b{color:var(--ink);font-weight:600}
  .langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .langtoggle button{background:transparent;color:var(--muted);border:none;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.5px}
  .langtoggle button.active{background:var(--gold);color:#1a1206}
  section{margin-bottom:34px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .dot{width:10px;height:10px;border-radius:50%}
  .sec-head h2{font-size:18px;font-weight:600}
  .sec-head .sub{color:var(--muted);font-size:13px;margin-left:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .val{font-size:28px;font-weight:700;margin-top:6px}
  .card .chg{font-size:13px;margin-top:4px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h3{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--ink)}
  canvas{max-height:230px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.title{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .split{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 4px}
  .split span{display:block}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:22px}
  footer{color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h3 data-i18n="recentContent"></h3>

  <!-- INSTAGRAM -->

    <div class="cards" id="igCards"></div>
    <div class="grid2">
      <div class="panel"><h3 data-i18n="igDaily"></h3><canvas id="igReach"></canvas></div>
      <div class="panel">
        <h3 data-i18n="viewsSource"></h3>
        <div class="split" id="igViewsSplit"></div>
        <div class="legend"><span><i style="background:var(--ig)"></i><span data-i18n="followers"></span> <b id="igVF"></b></span><span><i style="background:#3a4250"></i><span data-i18n="nonFollowers"></span> <b id="igVN"></b></span></div>
        <h3 style="margin-top:18px" data-i18n="igIntSource"></h3>
        <div class="split" id="igIntSplit"></div>
        <div class="legend"><span><i style="background:var(--ig)"></i><span data-i18n="followers"></span> <b id="igIF"></b></span><span><i style="background:#3a4250"></i><span data-i18n="nonFollowers"></span> <b id="igIN"></b></span></div>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h3 data-i18n="recentContent"></h3>
      <table><thead><tr><th data-i18n="thDate"></th><th data-i18n="thPost"></th><th class="num" data-i18n="thViews"></th><th class="num" data-i18n="thLikes"></th><th class="num" data-i18n="thComments"></th><th class="num" data-i18n="thShares"></th></tr></thead><tbody id="igPosts"></tbody></table>
    </div>
  </section>

  <!-- YOUTUBE -->
  <section>
    <div class="sec-head"><span class="dot" style="background:var(--yt)"></span><h2>YouTube</h2><span class="sub">YouTube Studio</span></div>
    <div class="cards" id="ytCards"></div>
    <div class="panel" style="margin-top:16px">
      <h3 data-i18n="ytLatest"></h3>
      <table><thead><tr><th data-i18n="thTitle"></th><th class="num" data-i18n="thViews"></th><th class="num">CTR</th><th class="num" data-i18n="thAvgDur"></th><th class="num" data-i18n="thRank"></th></tr></thead><tbody id="ytVideos"></tbody></table>
    </div>
  </section>

  <!-- LINKEDIN -->
  <section>
    <div class="sec-head"><span class="dot" style="background:var(--li)"></span><h2>LinkedIn</h2><span class="sub" id="liSub"></span></div>
    <div class="cards" id="liCards"></div>
    <div class="grid2">
      <div class="panel"><h3 data-i18n="liLoc"></h3><canvas id="liLoc"></canvas></div>
      <div class="panel">
        <h3 data-i18n="liImpr"></h3>
        <div class="split" id="liImprSplit"></div>
        <div class="legend"><span><i style="background:var(--li)"></i><span data-i18n="thisPeriod"></span> <b id="liImprNow"></b></span><span><i style="background:#3a4250"></i><span data-i18n="prevPeriod"></span> <b id="liImprPrior"></b></span></div>
        <h3 style="margin-top:18px" data-i18n="liTopLoc"></h3>
        <table><tbody id="liLocTable"></tbody></table>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

/* ===== RENDER ===== */
let LANG = "vi";
const charts = {};
const fmt = n => typeof n==="number" ? n.toLocaleString(LANG==="vi"?"vi-VN":"en-US") : n;
const arrow = d => d==="up"?"▲":d==="down"?"▼":"■";
function chgHTML(k){
  if(k.dir==="flat") return `<div class="chg flat">■ ${k.pct}%</div>`;
  return `<div class="chg ${k.dir}">${arrow(k.dir)} ${k.pct}%</div>`;
}
function cards(el, kpis){
  document.getElementById(el).innerHTML = kpis.map(k=>`
    <div class="card"><div class="label">${k.label[LANG]}</div>
    <div class="val">${fmt(k.value)}</div>${chgHTML(k)}</div>`).join("");
}
function splitBar(el, a, b, ca, cb){
  document.getElementById(el).innerHTML =
    `<span style="width:${a}%;background:${ca}"></span><span style="width:${b}%;background:${cb}"></span>`;
}
function dateLabels(n){
  const out=[]; for(let i=0;i<n;i++){const d=new Date(START_DATE);d.setDate(d.getDate()+i);out.push(`${d.getDate()}/${d.getMonth()+1}`);} return out;
}
function lineChart(id,data,color){
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id),{type:"line",
    data:{labels:dateLabels(data.length),datasets:[{data,borderColor:color,backgroundColor:color+"22",fill:true,tension:.35,pointRadius:0,borderWidth:2}]},
    options:{plugins:{legend:{display:false}},scales:{
      x:{ticks:{color:"#9aa3af",maxTicksLimit:8,font:{size:10}},grid:{display:false}},
      y:{ticks:{color:"#9aa3af",font:{size:10}},grid:{color:"#20242c"},beginAtZero:true}}}});
}
const locLabel = l => (T[l] ? T[l][LANG] : l);

function render(){
  document.documentElement.lang = LANG;
  document.getElementById("btnVI").classList.toggle("active", LANG==="vi");
  document.getElementById("btnEN").classList.toggle("active", LANG==="en");
  document.querySelectorAll("[data-i18n]").forEach(e=>{ e.textContent = T[e.dataset.i18n][LANG]; });

  document.getElementById("h1").textContent = T.h1[LANG];
  document.getElementById("periodPrefix").textContent = T.periodPrefix[LANG];
  document.getElementById("periodVal").textContent = LANG==="vi" ? PERIOD_VI : PERIOD_EN;
  document.getElementById("topNote").innerHTML = NOTE[LANG];

  cards("fbCards", FB.kpis);
  splitBar("fbViewsSplit", FB.viewsSrc.f, FB.viewsSrc.n, "var(--gold)", "#3a4250");
  document.getElementById("fbVF").textContent = FB.viewsSrc.f+"%";
  document.getElementById("fbVN").textContent = FB.viewsSrc.n+"%";
  const fbIntTotal = FB.intSrc.f+FB.intSrc.n;
  splitBar("fbIntSplit", FB.intSrc.f/fbIntTotal*100, FB.intSrc.n/fbIntTotal*100, "var(--fb)", "#3a4250");
  document.getElementById("fbIF").textContent = FB.intSrc.f;
  document.getElementById("fbIN").textContent = FB.intSrc.n;
  lineChart("fbViews", FB.viewsDaily, "#1877f2");
  document.getElementById("fbPosts").innerHTML = FB.posts.map(p=>`
    <tr><td>${p.d}</td><td class="title" title="${p.t}">${p.t}</td>
    <td class="num">${fmt(p.r)}</td><td class="num">${p.re}</td><td class="num">${p.c}</td><td class="num">${p.s}</td></tr>`).join("");

  cards("igCards", IG.kpis);
  splitBar("igViewsSplit", IG.viewsSrc.f, IG.viewsSrc.n, "var(--ig)", "#3a4250");
  document.getElementById("igVF").textContent = IG.viewsSrc.f+"%";
  document.getElementById("igVN").textContent = IG.viewsSrc.n+"%";
  splitBar("igIntSplit", IG.intSrc.f, IG.intSrc.n, "var(--ig)", "#3a4250");
  document.getElementById("igIF").textContent = IG.intSrc.f+"%";
  document.getElementById("igIN").textContent = IG.intSrc.n+"%";
  lineChart("igReach", IG.reachDaily, "#e1306c");
  document.getElementById("igPosts").innerHTML = IG.posts.map(p=>`
    <tr><td>${p.d}</td><td class="title" title="${p.t}">${p.t}</td>
    <td class="num">${fmt(p.v)}</td><td class="num">${p.l}</td><td class="num">${p.c}</td><td class="num">${p.s}</td></tr>`).join("");

  cards("ytCards", YT.kpis);
  if(YT.stale){
    document.querySelectorAll("section")[2].querySelector(".sub").innerHTML =
      `YouTube Studio <span class="badge" style="color:var(--down);border-color:var(--down)">${LANG==="vi"?"Dữ liệu kỳ trước · chưa truy cập được":"Previous data · not reachable"}</span>`;
  }
  document.getElementById("ytVideos").innerHTML = YT.topVideos.map(v=>`
    <tr><td class="title" title="${v.t}">${v.t}</td>
    <td class="num">${fmt(v.v)}</td><td class="num">${v.ctr}</td><td class="num">${v.avg}</td><td class="num">${v.rank}</td></tr>`).join("");

  document.getElementById("liSub").textContent = LI.sub[LANG];
  cards("liCards", LI.kpis);
  if(charts.liLoc) charts.liLoc.destroy();
  charts.liLoc = new Chart(document.getElementById("liLoc"),{type:"doughnut",
    data:{labels:LI.locLabels.map(locLabel),datasets:[{data:LI.locData,
      backgroundColor:["#0a66c2","#3b82f6","#60a5fa","#93c5fd","#3a4250"],
      borderColor:"#15181d",borderWidth:2}]},
    options:{plugins:{legend:{position:"right",labels:{color:"#9aa3af",font:{size:11},boxWidth:10,padding:8}}},cutout:"58%"}});
  const liImprTotal = LI.imprNow + LI.imprPrior;
  splitBar("liImprSplit", LI.imprNow/liImprTotal*100, LI.imprPrior/liImprTotal*100, "var(--li)", "#3a4250");
  document.getElementById("liImprNow").textContent = fmt(LI.imprNow);
  document.getElementById("liImprPrior").textContent = fmt(LI.imprPrior);
  const liTotalF = LI.locData.reduce((a,b)=>a+b,0);
  document.getElementById("liLocTable").innerHTML = LI.locLabels.map((l,i)=>`
    <tr><td>${locLabel(l)}</td><td class="num">${LI.locData[i]}</td>
    <td class="num">${(LI.locData[i]/liTotalF*100).toFixed(1)}%</td></tr>`).join("");

  const upd = LANG==="vi"?"Cập nhật":"Updated";
  const src = LANG==="vi"?"Dữ liệu đọc trực tiếp từ Meta Business Suite &amp; YouTube Studio &amp; LinkedIn":"Data read directly from Meta Business Suite, YouTube Studio &amp; LinkedIn";
  document.getElementById("footer").innerHTML =
    `DX Living Social Dashboard · ${LANG==="vi"?PERIOD_VI:PERIOD_EN} · ${upd} ${RUN_DATE} · ${src}`;
}
function setLang(l){ LANG=l; render(); }
render();
</script>
</body>
</html>
