<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DXL + FDX Marketing Hub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1115}
  #bar{display:flex;align-items:center;gap:4px;min-height:52px;padding:6px 14px;background:#171a21;border-bottom:1px solid #262b36;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  #brands{display:flex;gap:2px;background:#0f1115;border:1px solid #2b313d;border-radius:9px;padding:3px;margin-right:14px}
  .brand{appearance:none;border:0;background:transparent;color:#9aa4b2;font-size:13px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;letter-spacing:.03em}
  .brand.on{background:#e5dcc7;color:#171a21}
  .tab{appearance:none;border:0;background:transparent;color:#9aa4b2;font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
  .tab:hover{background:#20242e;color:#d7dde6}
  .tab.on{background:#2b6cf6;color:#fff}
  #spacer{flex:1}
  #open,#xlsx{color:#7f8b9c;font-size:12px;text-decoration:none;padding:6px 10px;border:1px solid #2b313d;border-radius:7px}
  #xlsx{margin-right:10px}
  #open:hover,#xlsx:hover{color:#cfd6e0;border-color:#414a59}
  #stage{position:relative;height:calc(100% - 52px)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  iframe.on{display:block}
</style>
</head>
<body>

<div id="bar">
  <div id="brands">
    <button class="brand" data-b="dxl">DX Living</button>
    <button class="brand" data-b="fdx">FeelDX</button>
  </div>
  <span id="tabs"></span>
  <span id="spacer"></span>
  <a id="xlsx" download title="Tải số liệu dạng Excel">↓ Excel</a>
  <a id="open" target="_blank" rel="noopener">Open in new tab ↗</a>
</div>
<div id="stage"></div>

<script>
  // Một link cho cả hai thương hiệu. Hash: #dxl/social, #fdx/seo ... (hash cũ #seo vẫn hiểu là DXL).
  const G = 'https://tram-fdx.github.io/';
  const HUB = {
    dxl: { xlsx: G + 'dxl-social-dashboard-site/dxl-metrics.xlsx', tabs: [
      ['social', 'Social', G + 'dxl-social-dashboard-site/'],
      ['seo', 'SEO', G + 'dxliving-seo-report/'],
      ['weekly', 'SEO Weekly', G + 'dxliving-seo-report/weekly/', 'weekly'],
      ['audit', 'Website Audit', G + 'dxl-seo-audit/'],
      ['funnel', 'Impact Funnel', G + 'dxl-impact-funnel/'] ] },
    fdx: { xlsx: null, tabs: [
      ['social', 'Social', G + 'feeldx-report/feeldx-social.html'],
      ['seo', 'SEO', G + 'feeldx-report/feeldx-seo-report.html'],
      ['weekly', 'SEO Weekly', G + 'feeldx-report/feeldx-seo-weekly.html'],
      ['audit', 'Website Audit', G + 'feeldx-report/feeldx-website-audit.html'],
      ['funnel', 'Impact Funnel', G + 'feeldx-report/feeldx-impact-funnel.html'] ] }
  };
  const stage = document.getElementById('stage'), tabsEl = document.getElementById('tabs');
  const openLink = document.getElementById('open'), xlsx = document.getElementById('xlsx');
  const frames = {};   // "dxl/social" -> iframe (nạp lười, giữ lại khi chuyển tab)
  const weeklyCache = {};

  async function resolve(t) {
    if (t[3] !== 'weekly') return t[2];
    if (weeklyCache[t[2]]) return weeklyCache[t[2]];
    try {   // tab Weekly luôn mở tuần mới nhất
      const j = await (await fetch(t[2] + 'index.json', { cache: 'no-store' })).json();
      const id = j.latest || (j.weeks || []).map(w => w.id).sort().pop();
      if (id) return (weeklyCache[t[2]] = t[2] + id + '.html');
    } catch (e) {}
    return t[2];
  }

  async function show(b, key) {
    const hub = HUB[b] || HUB.dxl;
    const t = hub.tabs.find(x => x[0] === key) || hub.tabs[0];
    document.querySelectorAll('.brand').forEach(x => x.classList.toggle('on', x.dataset.b === b));
    tabsEl.innerHTML = hub.tabs.map(x => `<button class="tab${x === t ? ' on' : ''}" data-k="${x[0]}">${x[1]}</button>`).join('');
    tabsEl.querySelectorAll('.tab').forEach(x => x.onclick = () => show(b, x.dataset.k));
    const id = b + '/' + t[0], url = await resolve(t);
    if (!frames[id]) { const f = document.createElement('iframe'); f.src = url; stage.appendChild(f); frames[id] = f; }
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('on', k === id));
    openLink.href = url;
    xlsx.style.display = hub.xlsx ? '' : 'none'; if (hub.xlsx) xlsx.href = hub.xlsx;
    history.replaceState(null, '', '#' + id);
    document.title = (b === 'fdx' ? 'FeelDX' : 'DX Living') + ' · ' + t[1] + ' — Marketing Hub';
  }

  document.querySelectorAll('.brand').forEach(x => x.onclick = () => {
    const cur = (location.hash.slice(1).split('/')[1]) || 'social';
    show(x.dataset.b, cur);
  });
  const h = location.hash.slice(1).split('/');
  if (HUB[h[0]]) show(h[0], h[1]); else show('dxl', h[0]);
</script>
</body>
</html>
