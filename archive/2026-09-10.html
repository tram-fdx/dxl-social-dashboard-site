insights:{en:["THE STRONGEST OPENER IN THIS SERIES: the 9 Sep post on Project 251's Concreet decorative concrete surface took 173 views, 4 reactions and 1 share on its first evening — nearly ten times the 8 Sep opener (18) and seven times the 7 Sep one (25). A story published two minutes later took 28 views and 3 reactions, itself higher than any story recorded here.","PAGE FOLLOWERS FINALLY MOVED: 115 → 116, the first gain in over two weeks. The in-window net-new counter still reads 0 because the gain lands on 9 Sep, outside a window that ends 8 Sep.","The window rolled one day forward to 12 Aug – 8 Sep. 11 Aug (422 views, the highest day of the old window) dropped out and 8 Sep (259 views) came in, so views moved 3,951 → 3,788 and the prior-period comparison widened from ▼20.9% to ▼28.8%. This is a window effect, not a weak new post.","Visits 284 → 312 and the comparison flipped from ▼5.0% to ▲6.1% — 8 Sep contributed 30 visits. Apart from video, this is the only Facebook line up on the prior period.","Video 3-second views 154 → 160 (▲13.5%) on 30 views from 8 Sep, but watch time slipped 52m 41s → 52m 27s and swung hard to ▼17.7%. Viewers 420 → 342 (▼36.1%) and interactions 157 → 149 (▼19.9%). All four 28-day series reconcile exactly to their KPIs: 3,788 / 312 / 149 / 160.","Everything already published kept maturing: 8 Sep 18 → 43, 7 Sep 39 → 57, 6 Sep 51 → 69, 4 Sep 54 → 72 and 3 Sep 66 → 75. The 2 Sep post (346 views) and the 1 Sep post have both scrolled off the panel, which now returns six post rows plus two story rows."],
vi:["MỞ HÀNG MẠNH NHẤT TỪ TRƯỚC TỚI NAY: bài 9/9 về bề mặt bê tông trang trí Concreet của Project 251 lấy 173 view, 4 cảm xúc và 1 chia sẻ ngay tối đầu tiên — gấp gần mười lần bài 8/9 (18) và gấp bảy lần bài 7/9 (25). Story đăng sau đó hai phút cũng lấy 28 view và 3 cảm xúc, cao hơn mọi story từng ghi nhận.","FOLLOWER TRANG CUỐI CÙNG ĐÃ TĂNG: 115 → 116, lần đầu sau hơn hai tuần. Bộ đếm follower ròng trong cửa sổ vẫn 0 vì lần tăng rơi vào ngày 9/9, nằm ngoài cửa sổ kết thúc 8/9.","Cửa sổ trượt một ngày sang 12/8 – 8/9. Ngày 11/8 (422 view, ngày cao nhất của cửa sổ cũ) rơi ra, ngày 8/9 (259 view) vào, nên views lùi 3.951 → 3.788 và phép so kỳ trước doãng từ ▼20,9% ra ▼28,8%. Đây là hiệu ứng cửa sổ, không phải bài mới yếu.","Lượt truy cập 284 → 312 và phép so lật từ ▼5,0% sang ▲6,1% — ngày 8/9 đóng góp 30 lượt. Ngoài video, đây là dòng Facebook duy nhất tăng so kỳ trước.","Video 3 giây 154 → 160 (▲13,5%) nhờ 30 view ngày 8/9, nhưng thời gian xem 52 phút 41 giây → 52 phút 27 giây và lật mạnh sang ▼17,7%. Người xem 420 → 342 (▼36,1%) và tương tác 157 → 149 (▼19,9%). Cả bốn chuỗi 28 ngày khớp đúng KPI: 3.788 / 312 / 149 / 160.","Mọi bài đã đăng đều chín thêm: 8/9 từ 18 → 43, 7/9 từ 39 → 57, 6/9 từ 51 → 69, 4/9 từ 54 → 72 và 3/9 từ 66 → 75. Bài 2/9 (346 view) và bài 1/9 đều đã trôi khỏi bảng, giờ còn sáu dòng bài viết cộng hai dòng story."]},

insights:{en:["The 9 Sep Concreet cross-post opened at 11 reach, 4 likes and 1 share — the highest first-evening reach of any post in this series and straight to the top of the panel. Post count 120 → 121; followers held at 48 for a third read.","Views 1,205 → 1,211 (▲19.7%) but reach fell hard, 273 → 195 (▼28.3%), and interactions 55 → 49 (▼33.8%). The cause is the window: 11 Aug (107 views, 87 reach, 6 interactions) dropped out and 8 Sep (84 views, 10 reach, 0 interactions) came in.","THE VIEW MIX REVERSED: 61.4% of views now come from followers (630) against 38.6% from non-followers (581), flipping yesterday's 54.7/45.3. Followers-sourced views are ▲25.6% while non-follower views are ▼24.5%.","Reach still runs on discovery — 176 of 195 from non-followers against 19 from followers, 90% of the total — but non-follower reach itself is ▼31.3%, so the discovery engine that carried this account is cooling.","Everything on the panel matured: 8 Sep 7 → 9 and 3 Sep 8 → 9. The 25 Aug post has scrolled off the eight-row recent-content panel.","Views (1,211) and interactions (49) reconcile exactly to their KPIs, and reach splits exactly (19 + 176 = 195). The daily reach series (286) does not sum to 195 because reach is de-duplicated per person, which is expected. Following held at 36."],
vi:["Bài đăng chéo Concreet 9/9 mở hàng 11 reach, 4 like và 1 chia sẻ — reach tối đầu tiên cao nhất của mọi bài trong chuỗi này và lên thẳng đầu bảng. Số bài 120 → 121; follower giữ 48 kỳ thứ ba.","Views 1.205 → 1.211 (▲19,7%) nhưng reach rơi mạnh 273 → 195 (▼28,3%) và tương tác 55 → 49 (▼33,8%). Nguyên nhân là cửa sổ: ngày 11/8 (107 view, 87 reach, 6 tương tác) rơi ra và ngày 8/9 (84 view, 10 reach, 0 tương tác) vào.","CƠ CẤU VIEWS ĐẢO CHIỀU: 61,4% views giờ đến từ follower (630) so với 38,6% từ người chưa follow (581), lật ngược tỷ lệ 54,7/45,3 hôm qua. Views từ follower ▲25,6% trong khi views từ người chưa follow ▼24,5%.","Reach vẫn sống nhờ khám phá — 176 trên 195 từ người chưa follow so với 19 từ follower, tức 90% — nhưng chính reach từ người chưa follow lại ▼31,3%, nên cỗ máy khám phá từng gánh tài khoản này đang nguội đi.","Mọi bài trên bảng đều chín thêm: 8/9 từ 7 → 9 và 3/9 từ 8 → 9. Bài 25/8 đã trôi khỏi bảng tám dòng.","Views (1.211) và tương tác (49) khớp đúng KPI, và reach tách đúng (19 + 176 = 195). Chuỗi reach theo ngày (286) không cộng bằng 195 vì reach được khử trùng theo người, đây là điều bình thường. Đang theo dõi giữ 36."]},

insights:{en:["THE CHANNEL BROKE OUT: the 8 Sep Short entered the window and dragged views 61 → 288, a 4.7x jump in a single day. 'How Project Control Keeps Decisions Moving' alone carries 269 views at 71.2% average percentage viewed — 93% of everything the channel earned across 28 days.","Watch time 0.1 → 0.2 hrs and the decline against the previous 28 days eased from ▼97% to ▼90%. Studio again reported a typical-performance comparison for Views ('188 more than usual') rather than a prior-period percentage, so no prior bar is drawn rather than a derived one.","BUT 269 VIEWS PRODUCED ZERO NEW SUBSCRIBERS — the count is still exactly 4. That is the clearest CTA gap anywhere in this report: the reach exists, the ask does not.","A second Short went up on 9 Sep, 'The Process Behind the Finish - Project 251', reaching 112 views and 37.1% average viewed in its first 17 hours 19 minutes. Against the 8 Sep Short (269 views, 71.2% at 13 hours) that is materially weaker on both volume and retention — a useful early signal about which hook works.","The top-content table has ten rows summing to 286 against the 288 channel total. Studio displayed a banner saying view counting was updated and recent counts may be higher, which is the most likely source of the 2-view gap, so nothing was adjusted. Library composition read from the Studio content tabs: 15 long-form and 15 Shorts, 30 in total, after two uploads in two days."],
vi:["KÊNH ĐÃ BỨT: Short 8/9 vào cửa sổ và kéo views 61 → 288, gấp 4,7 lần chỉ trong một ngày. Riêng 'How Project Control Keeps Decisions Moving' gánh 269 view với 71,2% tỷ lệ xem trung bình — chiếm 93% toàn bộ view của kênh trong 28 ngày.","Watch time 0,1 → 0,2 giờ và mức giảm so 28 ngày trước dịu từ ▼97% xuống ▼90%. Studio một lần nữa đưa so sánh hiệu quả thông thường cho Views ('188 more than usual') thay vì phần trăm so kỳ trước, nên không vẽ cột kỳ trước thay vì vẽ số suy ra.","NHƯNG 269 VIEW KHÔNG MANG VỀ NGƯỜI ĐĂNG KÝ NÀO — vẫn đúng 4. Đây là lỗ hổng CTA rõ nhất trong toàn bộ báo cáo: có người xem, thiếu lời mời.","Short thứ hai lên ngày 9/9, 'The Process Behind the Finish - Project 251', đạt 112 view và 37,1% tỷ lệ xem sau 17 giờ 19 phút. So với Short 8/9 (269 view, 71,2% ở mốc 13 giờ) thì yếu hơn hẳn cả về lượng lẫn giữ chân — một tín hiệu sớm hữu ích về hook nào chạy được.","Bảng top nội dung có mười dòng cộng lại 286 so với tổng 288 của kênh. Studio hiển thị thông báo đã cập nhật cách đếm view và số gần đây có thể cao hơn, nhiều khả năng là nguồn của chênh lệch 2 view, nên không điều chỉnh gì. Cơ cấu kho đọc từ tab nội dung Studio: 15 video dài và 15 Shorts, tổng 30, sau hai lần đăng trong hai ngày."]},

// ============ render ============
let lang="en", current="all", charts=[];  // English is the pinned default on load
const $=id=>document.getElementById(id);
const tt=(o)=>o[lang];
const num=v=>typeof v==="string"?v:v.toLocaleString();
const COLORS=["#1877f2","#5b6bf5","#22c55e","#f59e0b","#e1306c","#06b6d4"];
function clearCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];}
function chg(c){if(c==null)return `<div class="c flat">${tt(T.snapshotTag)}</div>`;const cls=c>0?"up":(c<0?"down":"flat");const a=c>0?"▲":(c<0?"▼":"■");return `<div class="c ${cls}">${a} ${Math.abs(c)}% ${tt(T.vsPrior)}</div>`;}
function kpis(arr){return `<div class="kpirow">`+arr.map(k=>`<div class="kpi"><div class="l">${k[lang]}</div><div class="v">${num(k.v)}</div>${chg(k.c)}</div>`).join("")+`</div>`;}
function line(id,labels,data,color){charts.push(new Chart($(id),{type:"line",data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+"22",fill:true,tension:.35,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:7,font:{size:10}}},y:{beginAtZero:true,ticks:{font:{size:10}}}}}}));}
function bar(id,labels,data,colors){charts.push(new Chart($(id),{type:"bar",data:{labels,datasets:[{data,backgroundColor:colors||"#5b6bf5",borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));}
function dough(id,labels,data){charts.push(new Chart($(id),{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:COLORS,borderColor:"#fff",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}}));}
function list(arr){return `<ul class="clean">`+arr.map(t=>`<li>${t}</li>`).join("")+`</ul>`;}
Object.assign(T,{
deepDive:{en:"Deep dive — computed metrics",vi:"Phân tích sâu — chỉ số tính toán"},
topByReach:{en:"Top posts by reach",vi:"Top bài theo reach"},
audience:{en:"Audience",vi:"Đối tượng"},
audNote:{en:"Detailed age, gender & city breakdowns aren't available — Meta hides demographics for audiences under ~100 per segment (FB 115 / IG 48 followers). They unlock as the audience grows. Follower vs non-follower reach below is the available proxy; LinkedIn already exposes full visitor demographics.",vi:"Phân tích tuổi/giới tính/thành phố chưa có — Meta ẩn nhân khẩu học khi đối tượng dưới ~100/nhóm (FB 115 / IG 48 follower). Sẽ mở khi đối tượng lớn hơn. Tỷ lệ reach follower vs chưa follow bên dưới là chỉ số thay thế; LinkedIn đã có nhân khẩu học khách truy cập đầy đủ."},
engRate:{en:"Engagement rate",vi:"Tỷ lệ tương tác"},
avgReachPost:{en:"Avg reach / post",vi:"Reach TB/bài"},
nonFollReach:{en:"Reach from non-followers",vi:"Reach từ chưa follow"},
avgPerDay:{en:"Avg / day",vi:"Trung bình/ngày"},
bestDay:{en:"Best day",vi:"Ngày tốt nhất"},
postsSampled:{en:"Posts sampled",vi:"Số bài mẫu"},
keyInsight:{en:"Key insight",vi:"Nhận định then chốt"}
});
function deepCards(items){return `<div class="kpirow">`+items.map(i=>`<div class="kpi" style="border-top-color:#22c55e"><div class="l">${i.l}</div><div class="v" style="font-size:20px">${i.v}</div>${i.s?`<div class="c flat">${i.s}</div>`:""}</div>`).join("")+`</div>`;}
function hbar(id,labels,data,color){charts.push(new Chart($(id),{type:"bar",data:{labels,datasets:[{data,backgroundColor:color,borderRadius:5}]},options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}}));}
function audiencePanel(srcLabelA,srcLabelB,vals){return `<div class="panel"><h3>${tt(T.audience)}</h3><div class="note" style="margin-top:0">${tt(T.audNote)}</div><div class="chart sm" style="height:180px;margin-top:8px"><canvas id="aud"></canvas></div></div>`;}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}
function bestOf(daily){const m=Math.max(...daily);return {v:m,label:dlabels[daily.indexOf(m)]};}
function postsTable(posts,firstColReactLabel){return `<table><thead><tr><th>${tt(T.post)}</th><th>${tt(T.date)}</th><th class="num">${tt(T.reach)}</th><th class="num">${firstColReactLabel}</th><th class="num">${tt(T.cmts)}</th><th class="num">${tt(T.shares)}</th></tr></thead><tbody>`+posts.map(p=>`<tr><td class="post">${p.t}</td><td>${p.d}</td><td class="num">${p.reach}</td><td class="num">${p.react!=null?p.react:p.likes}</td><td class="num">${p.com}</td><td class="num">${p.sh}</td></tr>`).join("")+`</tbody></table>`;}

function head(k,badge,color,per,chip){$("hdBadge").style.background=color;$("hdBadge").textContent=badge;$("hdTitle").textContent=tt(T.title[k]);$("hdPer").textContent=per;$("hdChip").textContent=chip;}

// ============ PDF export — pick a period, then download all five channel views per day ============
const PDFCH=["all","linkedin","instagram","facebook","youtube"];
let PDFDAYS=[];

function pdfFmt(iso){const[y,m,d]=iso.split("-");return d+"/"+m+"/"+y;}
function pdfSel(id){return $(id).value;}
function pdfRangeDays(){
  const a=PDFDAYS.indexOf(pdfSel("pdfFrom")),b=PDFDAYS.indexOf(pdfSel("pdfTo"));
  if(a<0||b<0||a>b)return null;
  return PDFDAYS.slice(a,b+1);
}
function pdfSyncMeta(){
  const r=pdfRangeDays();
  $("pdfMeta").textContent=r?tt(T.pdfRange)(r.length):tt(T.pdfBad);
  $("pdfGo").disabled=!r;
}
function pdfLabels(){
  $("pdfPopTitle").textContent=tt(T.pdfTitle);
  $("pdfFromLab").textContent=tt(T.pdfFrom);
  $("pdfToLab").textContent=tt(T.pdfTo);
  $("pdfCancel").textContent=tt(T.pdfCancel);
  if(!$("pdfGo").dataset.busy)$("pdfGo").textContent=tt(T.pdfGo);
  const q=$("pdfQuick");
  if(q.children.length===3){q.children[0].textContent=tt(T.pdfQ1);q.children[1].textContent=tt(T.pdfQ7);q.children[2].textContent=tt(T.pdfQAll);}
  pdfSyncMeta();
}
function pdfFill(days){
  PDFDAYS=days;
  const opt=d=>'<option value="'+d+'">'+pdfFmt(d)+'</option>';
  $("pdfFrom").innerHTML=days.map(opt).join("");
  $("pdfTo").innerHTML=days.map(opt).join("");
  const last=days[days.length-1];
  $("pdfFrom").value=last;$("pdfTo").value=last;
  pdfSyncMeta();
}
function pdfQuickSet(n){
  if(!PDFDAYS.length)return;
  const days=n===0?PDFDAYS.slice():PDFDAYS.slice(-n);
  $("pdfFrom").value=days[0];$("pdfTo").value=days[days.length-1];
  pdfSyncMeta();
}
fetch("data/index.json").then(r=>r.json()).then(j=>{
  const days=(j.snapshots||[]).map(s=>s.date).filter(Boolean).sort();
  if(days.length)pdfFill(days);else $("pdfMeta").textContent=tt(T.pdfNone);
}).catch(()=>{ $("pdfMeta").textContent=tt(T.pdfNone); });

// capture the five channel views of one document into the pdf
async function pdfCaptureDoc(win,doc,addPage,scale){
  const main=doc.querySelector(".main");
  if(!main)return;
  const hide=[doc.getElementById("sec-filter"),doc.getElementById("metastrip"),doc.getElementById("sec-trend"),doc.getElementById("langFloat"),doc.querySelector(".hd .right")].filter(Boolean);
  const memo=hide.map(e=>e.style.display);
  try{
    for(const k of PDFCH){
      const rb=doc.querySelector('.rbtn[data-k="'+k+'"]');
      if(rb)rb.click();
      hide.forEach(e=>{e.style.display="none";});
      await new Promise(r=>setTimeout(r,900));
      const cv=await win.html2canvas(main,{scale:scale,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:main.scrollWidth});
      addPage(cv);
    }
  }finally{
    hide.forEach((e,i)=>{e.style.display=memo[i];});
  }
}

function pdfInject(win,doc,src){
  return new Promise((ok,bad)=>{
    if(typeof win.html2canvas==="function")return ok();
    const sc=doc.createElement("script");sc.src=src;sc.onload=()=>ok();sc.onerror=()=>bad();doc.head.appendChild(sc);
  });
}
const H2C_SRC="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";

async function downloadPdf(){
  const go=$("pdfGo");
  if(go.dataset.busy)return;
  const days=pdfRangeDays();
  if(!days)return;
  const jsPDF=(window.jspdf||{}).jsPDF;
  if(typeof html2canvas!=="function"||!jsPDF){alert(tt(T.pdfErr));return;}
  go.dataset.busy="1";go.disabled=true;$("pdfCancel").disabled=true;
  const prev=current;
  const scale=days.length>3?1.5:2;
  let doc=null;
  const addPage=cv=>{
    const w=cv.width/scale,h=cv.height/scale;
    if(!doc)doc=new jsPDF({unit:"pt",format:[w,h],orientation:w>h?"landscape":"portrait"});
    else doc.addPage([w,h],w>h?"landscape":"portrait");
    doc.addImage(cv.toDataURL("image/jpeg",days.length>3?0.85:0.92),"JPEG",0,0,w,h);
  };
  let ifr=null;
  try{
    for(let i=0;i<days.length;i++){
      const d=days[i];
      go.textContent=tt(T.pdfStep)(i+1,days.length,pdfFmt(d));
      if(d===SNAPDATE){
        await pdfCaptureDoc(window,document,addPage,scale);
      }else{
        ifr=document.createElement("iframe");
        ifr.setAttribute("aria-hidden","true");
        ifr.style.cssText="position:fixed;left:-20000px;top:0;width:1440px;height:2400px;border:0;visibility:hidden";
        const loaded=new Promise((ok,bad)=>{ifr.onload=()=>ok();ifr.onerror=()=>bad();});
        ifr.src="archive/"+d+".html";
        document.body.appendChild(ifr);
        await loaded;
        await new Promise(r=>setTimeout(r,1400));
        const w2=ifr.contentWindow,d2=ifr.contentDocument;
        await pdfInject(w2,d2,H2C_SRC);
        ifr.style.height=Math.max(2400,d2.body.scrollHeight)+"px";
        await new Promise(r=>setTimeout(r,300));
        await pdfCaptureDoc(w2,d2,addPage,scale);
        ifr.remove();ifr=null;
      }
    }
    const from=days[0],to=days[days.length-1];
    doc.save("DXL-social-dashboard-"+(from===to?from:from+"_to_"+to)+".pdf");
  }catch(e){alert(tt(T.pdfErr));}
  finally{
    if(ifr)try{ifr.remove()}catch(e){}
    current=prev;
    delete go.dataset.busy;go.disabled=false;$("pdfCancel").disabled=false;
    go.textContent=tt(T.pdfGo);
    render();pdfSyncMeta();
  }
}

  {l:{en:"Views (28d)",vi:"Lượt xem (28n)"},g:j=>gv(j,"facebook","views","v")},
  {l:{en:"Reach (viewers)",vi:"Người tiếp cận"},g:j=>gv(j,"facebook","viewers","v")},

 ]

let TRD=null, trCharts=[], trLoaded=false;
function trClear(){trCharts.forEach(c=>{try{c.destroy()}catch(e){}});trCharts=[];}
const trFmtD=iso=>{const p=iso.split("-");return p[2]+"/"+p[1];};
function trNum(v,d,suf){if(v==null)return "—";const n=(d?Number(v).toFixed(d):Math.round(v).toLocaleString());return n+(suf||"");}
function trDelta(cur,prev,d,suf){
  if(cur==null)return '<div class="d flat">—</div>';
  if(prev==null)return '<div class="d flat">■ '+TRT.first[lang]+'</div>';
  const diff=cur-prev;
  if(Math.abs(diff)<1e-9)return '<div class="d flat">■ '+TRT.nochg[lang]+'</div>';
  const pct=prev?Math.abs(diff/prev*100):null;
  return '<div class="d '+(diff>0?"up":"down")+'">'+(diff>0?"▲":"▼")+" "+trNum(Math.abs(diff),d,suf)+
         (pct!=null?" ("+pct.toFixed(1)+"%)":"")+'</div>';
}
function trSpark(id,labels,data,color){
  const el=$(id); if(!el)return;
  trCharts.push(new Chart(el,{type:"line",
    data:{labels,datasets:[{data,borderColor:color,backgroundColor:color+"1f",fill:true,tension:.35,pointRadius:0,pointHoverRadius:4,borderWidth:2,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{title:c=>c[0].label}}},
      scales:{x:{display:false},y:{display:false,beginAtZero:false}}}}));
}
function trBlock(key){
  const cfg=TRCH[key], defs=TRKPI[key], labels=TRD.map(r=>trFmtD(r.date));
  let h='<div class="tr-sec"><div class="th"><span class="tr-dot" style="background:'+cfg.color+'"></span><b>'+cfg.name+'</b>'+
        '<span>'+TRT.span[lang](TRD.length,trFmtD(TRD[0].date),trFmtD(TRD[TRD.length-1].date))+'</span></div><div class="tr-grid">';
  const jobs=[];
  defs.forEach((k,i)=>{
    const series=TRD.map(r=>k.g(r.j));
    const cur=series[series.length-1];
    let prev=null;
    for(let n=series.length-2;n>=0;n--){if(series[n]!=null){prev=series[n];break;}}
    const cid="tsp_"+key+"_"+i;
    h+='<div class="tr-card"><div class="l">'+k.l[lang]+'</div><div class="v">'+trNum(cur,k.d,k.suf)+'</div>'+
       trDelta(cur,prev,k.d,k.suf)+'<div class="tr-spark"><canvas id="'+cid+'"></canvas></div></div>';
    jobs.push([cid,series,cfg.color]);
  });
  return {html:h+'</div></div>', jobs, labels};
}
function renderTrend(){
  const box=$("trBody"); if(!box)return;
  $("trTitle").textContent=TRT.title[lang];
  $("trHelp").innerHTML=TRT.help[lang];
  trClear();
  if(!trLoaded){box.innerHTML='<div class="note" style="margin-top:0">'+TRT.loading[lang]+'</div>';return;}
  if(!TRD||TRD.length<2){box.innerHTML='<div class="note" style="margin-top:0">'+TRT.none[lang]+'</div>';return;}
  const keys=(current==="all")?["linkedin","instagram","facebook","youtube"]:[current];
  let html="", jobs=[], labels=[];
  keys.forEach(k=>{if(!TRKPI[k])return;const b=trBlock(k);html+=b.html;jobs=jobs.concat(b.jobs);labels=b.labels;});
  box.innerHTML=html||'<div class="note" style="margin-top:0">'+TRT.none[lang]+'</div>';
  jobs.forEach(j=>trSpark(j[0],labels,j[1],j[2]));
}

  });
}

let DPI=null, dpSel=null, dpMonth=null;
const dpFmt=iso=>{const[a,b,c]=iso.split("-");return c+"/"+b+"/"+a;};
const dpISO=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const dpSnap=iso=>DPI?DPI.snapshots.find(x=>x.date===iso):null;
function dpTarget(iso){
  if(!DPI)return null;
  if(iso===DPI.latest)return "index.html";
  const s=dpSnap(iso); if(!s)return null;
  return s.report?s.report:("history.html?day="+iso);
}

function dpGrid(el,y,m){
  const first=new Date(y,m,1), lead=first.getDay(), dim=new Date(y,m+1,0).getDate();

  for(let d=1;d<=dim;d++){
    const iso=dpISO(new Date(y,m,d)), has=!!dpSnap(iso), sel=iso===dpSel;
    h+='<button class="dp-day'+(has?"":" dim")+(sel?" sel":"")+'"'+(has?'':' disabled')+
       ' data-d="'+iso+'">'+d+(has?'<span class="dot"></span>':'')+'</button>';

  el.innerHTML=h;
  el.querySelectorAll("[data-d]:not(.dim)").forEach(b=>b.addEventListener("click",()=>{dpSel=b.dataset.d;dpDraw();}));

function dpDraw(){
