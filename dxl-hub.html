<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DXL Marketing Hub</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1115}
  #bar{display:flex;align-items:center;gap:4px;height:52px;padding:0 14px;background:#171a21;border-bottom:1px solid #262b36;position:sticky;top:0;z-index:10}
  #brand{color:#fff;font-weight:600;font-size:14px;margin-right:16px;letter-spacing:.02em}
  .tab{appearance:none;border:0;background:transparent;color:#9aa4b2;font-size:13px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .tab:hover{background:#20242e;color:#d7dde6}
  .tab.on{background:#2b6cf6;color:#fff}
  #spacer{flex:1}
  #open,#xlsx{color:#7f8b9c;font-size:12px;text-decoration:none;padding:6px 10px;border:1px solid #2b313d;border-radius:7px}
  #xlsx{margin-right:10px}
  #open:hover,#xlsx:hover{color:#cfd6e0;border-color:#414a59}
  #open:hover{color:#d7dde6;border-color:#3d4553}
  #stage{position:relative;height:calc(100% - 52px)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  iframe.on{display:block}
</style>
</head>
<body>

<div id="bar">
  <span id="brand">DX Living · Marketing Hub</span>
  <button class="tab on" data-i="0">Social</button>
  <button class="tab" data-i="1">SEO</button>
  <button class="tab" data-i="2">SEO Weekly</button>
  <button class="tab" data-i="3">Website Audit</button>
  <span id="spacer"></span>
  <a id="xlsx" href="https://tram-fdx.github.io/dxl-social-dashboard-site/dxl-metrics.xlsx"
     download title="Tải toàn bộ số liệu 3 báo cáo dưới dạng Excel — xuất lại mỗi sáng">↓ Excel</a>
  <a id="open" target="_blank" rel="noopener">Open in new tab ↗</a>
</div>

<div id="stage">
  <iframe class="on" src="https://tram-fdx.github.io/dxl-social-dashboard-site/"></iframe>
  <iframe data-src="https://tram-fdx.github.io/dxliving-seo-report/"></iframe>
  <!-- Tab nay khong hardcode mot tuan nua: script ben duoi doc weekly/index.json de lay tuan moi nhat.
       data-src chi la fallback khi fetch that bai. -->
  <iframe id="wkFrame"
          data-weekly="https://tram-fdx.github.io/dxliving-seo-report/weekly/"
          data-src="https://tram-fdx.github.io/dxliving-seo-report/weekly/2026-09-18.html"></iframe>
  <iframe data-src="https://tram-fdx.github.io/dxl-seo-audit/"></iframe>
</div>

<script>
  const tabs = [...document.querySelectorAll('.tab')];
  const frames = [...document.querySelectorAll('iframe')];
  const openLink = document.getElementById('open');
  const urls = frames.map(f => f.src || f.dataset.src);

  function show(i) {
    tabs.forEach((t, n) => t.classList.toggle('on', n === i));
    frames.forEach((f, n) => {
      f.classList.toggle('on', n === i);
      if (n === i && !f.src) f.src = f.dataset.src; // lazy load
    });
    openLink.href = urls[i];
    location.hash = ['social', 'seo', 'weekly', 'audit'][i];
  }

  tabs.forEach(t => t.onclick = () => show(+t.dataset.i));
  openLink.href = urls[0];

  // Tab "SEO Weekly" luon mo tuan moi nhat.
  // Truoc day URL nay bi hardcode nen bao cao dung o tuan 04/09 du da co tuan moi.
  // The weekly tab always opens the newest week; this URL used to be hardcoded.
  (async () => {
    const f = document.getElementById('wkFrame');
    if (!f) return;
    const base = f.dataset.weekly;
    try {
      const r = await fetch(base + 'index.json', { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      const latest = j.latest ||
        (Array.isArray(j.weeks) && j.weeks.length
          ? j.weeks.map(w => w.id).sort().pop()
          : null);
      if (!latest) return;
      const url = base + latest + '.html';
      if (url === urls[2]) return;
      urls[2] = url;
      f.dataset.src = url;
      if (f.src) f.src = url;                          // tab dang mo thi nap lai
      if (tabs[2].classList.contains('on')) openLink.href = url;
    } catch (e) { /* giu nguyen fallback trong data-src */ }
  })();

  const start = ['social', 'seo', 'weekly', 'audit'].indexOf(location.hash.slice(1));
  if (start > 0) show(start);

  // Iframes chi load duoc khi trang nay chay tren cung origin tram-fdx.github.io.
  if (location.protocol === 'file:') {
    const w = document.createElement('div');
    w.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#9aa4b2;font-size:14px;line-height:1.7;padding:40px;background:#0f1115';
    w.innerHTML = 'Trang nay dang mo bang file:// nen 3 dashboard khong nhung duoc.<br>Deploy len <b>tram-fdx.github.io</b> (cung origin) roi mo lai la chay binh thuong.';
    document.getElementById('stage').appendChild(w);
  }
</script>

</body>
</html>
